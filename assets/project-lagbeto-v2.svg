<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p2-t">
  <title id="p2-t">Lagbeto Platform: Scalable, modern startup platform built from the ground up.</title>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120508"/><stop offset="1" stop-color="#090305"/>
    </linearGradient>
    <radialGradient id="p2-glow" cx="80%" cy="30%" r="60%">
      <stop offset="0" stop-color="#8B1226" stop-opacity=".7"/><stop offset="1" stop-color="#450A14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#EF4444" stroke-opacity=".08"/>
    </pattern>
    <clipPath id="p2-clip"><rect width="1200" height="370" rx="18"/></clipPath>
  </defs>
  <style>
    .p2-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p2-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p2-in {  }
    .p2-d1 {  }
    .p2-chip {  }
    
    .p2-draw {  stroke-dashoffset: 0;  }
    
    
    
  </style>
  <g clip-path="url(#p2-clip)">
    <rect width="1200" height="370" fill="url(#p2-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p2-grid)"/>
    <rect width="1200" height="370" fill="url(#p2-glow)"/>
    <g class="p2-in p2-d1">
      <text class="p2-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#EF4444">02 · STARTUP · FULL-STACK VENTURE · 2026</text>
      <text class="p2-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#FFFFFF">Lagbeto Platform</text>
      <text class="p2-sans" x="56" y="166" font-size="17" fill="#94A3B8">Building a next-generation startup platform engineered for speed, scale and user engagement.</text>
      <text class="p2-mono" x="56" y="200" font-size="12.5" fill="#FCA5A5"><tspan fill="#EF4444">BUILT ›</tspan> Reactive frontend, resilient Go backend services, multi-tenant databases, real-time queues</text>
      <line class="p2-draw" x1="56" y1="226" x2="680" y2="226" stroke="#EF4444" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p2-serif" font-size="34" font-weight="300" fill="#FFFFFF">Founder</text><text class="p2-sans" y="24" font-size="12.5" fill="#94A3B8">Led product &amp; dev</text></g>
      <g transform="translate(261 266)"><text class="p2-serif" font-size="34" font-weight="300" fill="#FFFFFF">Multi-Tier</text><text class="p2-sans" y="24" font-size="12.5" fill="#94A3B8">Service Architecture</text></g>
      <g transform="translate(466 266)"><text class="p2-serif" font-size="34" font-weight="300" fill="#FFFFFF">Real-Time</text><text class="p2-sans" y="24" font-size="12.5" fill="#94A3B8">Event-driven pipelines</text></g>
      <g class="p2-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#20080E" stroke="#EF4444" stroke-opacity=".35"/><text class="p2-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#FCA5A5">Next.js</text></g>
      <g class="p2-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="50" height="26" rx="13" fill="#20080E" stroke="#EF4444" stroke-opacity=".35"/><text class="p2-mono" x="159" y="331" text-anchor="middle" font-size="11.5" fill="#FCA5A5">Go</text></g>
      <g class="p2-chip" style="animation-delay:1.24s"><rect x="192" y="314" width="90" height="26" rx="13" fill="#20080E" stroke="#EF4444" stroke-opacity=".35"/><text class="p2-mono" x="237" y="331" text-anchor="middle" font-size="11.5" fill="#FCA5A5">PostgreSQL</text></g>
      <g class="p2-chip" style="animation-delay:1.36s"><rect x="290" y="314" width="60" height="26" rx="13" fill="#20080E" stroke="#EF4444" stroke-opacity=".35"/><text class="p2-mono" x="320" y="331" text-anchor="middle" font-size="11.5" fill="#FCA5A5">Redis</text></g>
      <g class="p2-chip" style="animation-delay:1.48s"><rect x="358" y="314" width="70" height="26" rx="13" fill="#20080E" stroke="#EF4444" stroke-opacity=".35"/><text class="p2-mono" x="393" y="331" text-anchor="middle" font-size="11.5" fill="#FCA5A5">Docker</text></g>
    </g>
  </g>
</svg>