<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p2-t">
  <title id="p2-t">Lagbeto Platform: Scalable, modern startup platform built from the ground up.</title>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p2-glow" cx="80%" cy="30%" r="60%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="p2-clip"><rect width="1200" height="370" rx="18"/></clipPath>
  </defs>
  <style>
    .p2-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p2-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p2-in { animation: p2-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p2-d1 { animation-delay: .15s; }
    .p2-chip { animation: p2-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p2-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p2-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p2-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p2-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p2-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-in, .p2-chip { animation: none; } .p2-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g clip-path="url(#p2-clip)">
    <rect width="1200" height="370" fill="url(#p2-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p2-grid)"/>
    <rect width="1200" height="370" fill="url(#p2-glow)"/>
    <g class="p2-in p2-d1">
      <text class="p2-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">02 · STARTUP · FULL-STACK VENTURE · 2026</text>
      <text class="p2-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">Lagbeto Platform</text>
      <text class="p2-sans" x="56" y="166" font-size="17" fill="#B6A3AC">Building a next-generation startup platform engineered for speed, scale and user engagement.</text>
      <text class="p2-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT ›</tspan> Reactive frontend, resilient Go backend services, multi-tenant databases, real-time queues</text>
      <line class="p2-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p2-serif" font-size="34" font-weight="300" fill="#F8F0F3">Founder</text><text class="p2-sans" y="24" font-size="12.5" fill="#B6A3AC">Led product &amp; dev</text></g>
      <g transform="translate(261 266)"><text class="p2-serif" font-size="34" font-weight="300" fill="#F8F0F3">Multi-Tier</text><text class="p2-sans" y="24" font-size="12.5" fill="#B6A3AC">Service Architecture</text></g>
      <g transform="translate(466 266)"><text class="p2-serif" font-size="34" font-weight="300" fill="#F8F0F3">Real-Time</text><text class="p2-sans" y="24" font-size="12.5" fill="#B6A3AC">Event-driven pipelines</text></g>
      <g class="p2-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p2-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Next.js</text></g>
      <g class="p2-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="50" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p2-mono" x="159" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Go</text></g>
      <g class="p2-chip" style="animation-delay:1.24s"><rect x="192" y="314" width="90" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p2-mono" x="237" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">PostgreSQL</text></g>
      <g class="p2-chip" style="animation-delay:1.36s"><rect x="290" y="314" width="60" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p2-mono" x="320" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Redis</text></g>
      <g class="p2-chip" style="animation-delay:1.48s"><rect x="358" y="314" width="70" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p2-mono" x="393" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Docker</text></g>
    </g>
  </g>
</svg>