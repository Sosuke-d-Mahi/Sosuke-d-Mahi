      <g class="p1-chip" style="animation-delay:1.36s"><rect x="320" y="314" width="70" height="26" rx="13" fill="#20080E" stroke="#EF4444" stroke-opacity=".35"/><text class="p1-mono" x="355" y="331" text-anchor="middle" font-size="11.5" fill="#FCA5A5">OpenAPI</text></g>
      <g class="p1-chip" style="animation-delay:1.48s"><rect x="398" y="314" width="130" height="26" rx="13" fill="#20080E" stroke="#EF4444" stroke-opacity=".35"/><text class="p1-mono" x="463" y="331" text-anchor="middle" font-size="11.5" fill="#FCA5A5">Developer Tools</text></g>
