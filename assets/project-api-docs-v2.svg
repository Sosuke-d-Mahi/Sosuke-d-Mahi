      <g class="p1-chip" style="animation-delay:1.12s"><rect x="154" y="314" width="70" height="26" rx="13" fill="#20080E" stroke="#EF4444" stroke-opacity=".35"/><text class="p1-mono" x="189" y="331" text-anchor="middle" font-size="11.5" fill="#FCA5A5">Node.js</text></g>
