    <radialGradient id="tr-pulse"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#FCA5A5" stop-opacity=".6"/><stop offset="1" stop-color="#EF4444" stop-opacity="0"/></radialGradient>
