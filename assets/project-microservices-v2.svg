<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p4-t">
  <title id="p4-t">Cloud &amp; Microservices: Containerized multi-tier cloud services with automated deployment.</title>
