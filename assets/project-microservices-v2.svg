    .p4-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p4-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p4-in {  }
    .p4-d1 {  }
    .p4-chip {  }
    
    .p4-draw {  stroke-dashoffset: 0;  }
    
    
    
  </style>
  <g clip-path="url(#p4-clip)">
    <rect width="1200" height="370" fill="url(#p4-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p4-grid)"/>
    <rect width="1200" height="370" fill="url(#p4-glow)"/>
    <g class="p4-in p4-d1">
      <text class="p4-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#EF4444">04 · CLOUD &amp; INFRA · FULL-STACK · 2026</text>
      <text class="p4-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#FFFFFF">Cloud &amp; Microservices</text>
      <text class="p4-sans" x="56" y="166" font-size="17" fill="#94A3B8">Containerized multi-tier cloud services with automated deployment and edge caching.</text>
      <text class="p4-mono" x="56" y="200" font-size="12.5" fill="#FCA5A5"><tspan fill="#EF4444">BUILT ›</tspan> Docker Compose orchestration, Go &amp; Node microservices, Redis caching, Nginx proxy</text>
      <line class="p4-draw" x1="56" y1="226" x2="680" y2="226" stroke="#EF4444" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#FFFFFF">High</text><text class="p4-sans" y="24" font-size="12.5" fill="#94A3B8">Throughput APIs</text></g>
      <g transform="translate(261 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#FFFFFF">Zero</text><text class="p4-sans" y="24" font-size="12.5" fill="#94A3B8">Downtime Deployments</text></g>
      <g transform="translate(466 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#FFFFFF">&lt;2 min</text><text class="p4-sans" y="24" font-size="12.5" fill="#94A3B8">Automated CI/CD Spin-up</text></g>
      <g class="p4-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#20080E" stroke="#EF4444" stroke-opacity=".35"/><text class="p4-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#FCA5A5">Docker</text></g>
      <g class="p4-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="55" height="26" rx="13" fill="#20080E" stroke="#EF4444" stroke-opacity=".35"/><text class="p4-mono" x="161" y="331" text-anchor="middle" font-size="11.5" fill="#FCA5A5">Go</text></g>
      <g class="p4-chip" style="animation-delay:1.24s"><rect x="197" y="314" width="92" height="26" rx="13" fill="#20080E" stroke="#EF4444" stroke-opacity=".35"/><text class="p4-mono" x="243" y="331" text-anchor="middle" font-size="11.5" fill="#FCA5A5">PostgreSQL</text></g>
      <g class="p4-chip" style="animation-delay:1.36s"><rect x="297" y="314" width="122" height="26" rx="13" fill="#20080E" stroke="#EF4444" stroke-opacity=".35"/><text class="p4-mono" x="358" y="331" text-anchor="middle" font-size="11.5" fill="#FCA5A5">Docker Compose</text></g>
      <g class="p4-chip" style="animation-delay:1.48s"><rect x="426" y="314" width="80" height="26" rx="13" fill="#20080E" stroke="#EF4444" stroke-opacity=".35"/><text class="p4-mono" x="466" y="331" text-anchor="middle" font-size="11.5" fill="#FCA5A5">Cloudflare</text></g>
    </g>
