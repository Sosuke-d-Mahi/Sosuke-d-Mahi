      <stop offset="0" stop-color="#120508"/><stop offset="1" stop-color="#090305"/>
    </linearGradient>
    <radialGradient id="p4-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#8B1226" stop-opacity=".7"/><stop offset="1" stop-color="#450A14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p4-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#EF4444" stroke-opacity=".08"/>
