<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p4-t">
  <title id="p4-t">Cloud &amp; Microservices: Containerized multi-tier cloud services with automated deployment.</title>
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p4-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p4-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="p4-clip"><rect width="1200" height="370" rx="18"/></clipPath>
  </defs>
  <style>
    .p4-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p4-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p4-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p4-in { animation: p4-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p4-d1 { animation-delay: .15s; }
    .p4-chip { animation: p4-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p4-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p4-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p4-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p4-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p4-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-in, .p4-chip { animation: none; } .p4-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g clip-path="url(#p4-clip)">
    <rect width="1200" height="370" fill="url(#p4-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p4-grid)"/>
    <rect width="1200" height="370" fill="url(#p4-glow)"/>
    <g class="p4-in p4-d1">
      <text class="p4-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">04 · CLOUD &amp; INFRA · FULL-STACK · 2026</text>
      <text class="p4-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">Cloud &amp; Microservices</text>
      <text class="p4-sans" x="56" y="166" font-size="17" fill="#B6A3AC">Containerized multi-tier cloud services with automated deployment and edge caching.</text>
      <text class="p4-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT ›</tspan> Docker Compose orchestration, Go &amp; Node microservices, Redis caching, Nginx proxy</text>
      <line class="p4-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">High</text><text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">Throughput APIs</text></g>
      <g transform="translate(261 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">Zero</text><text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">Downtime Deployments</text></g>
      <g transform="translate(466 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">&lt;2 min</text><text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">Automated CI/CD Spin-up</text></g>
      <g class="p4-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Docker</text></g>
      <g class="p4-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="55" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="161" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Go</text></g>
      <g class="p4-chip" style="animation-delay:1.24s"><rect x="197" y="314" width="92" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="243" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">PostgreSQL</text></g>
      <g class="p4-chip" style="animation-delay:1.36s"><rect x="297" y="314" width="122" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="358" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Docker Compose</text></g>
      <g class="p4-chip" style="animation-delay:1.48s"><rect x="426" y="314" width="80" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="466" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Cloudflare</text></g>
    </g>
  </g>
</svg>