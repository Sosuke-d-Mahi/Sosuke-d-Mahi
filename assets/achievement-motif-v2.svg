<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="ach-title ach-desc">
  <title id="ach-title">Ventures and Telemetry</title>
  <desc id="ach-desc">Founder @ Lagbeto. Featured project api-docs. 679 public GitHub contributions. Full-stack software developer across TypeScript, Python, Go, Node.js, Flutter, Kotlin.</desc>

  <defs>
    <linearGradient id="ach-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120508"/>
      <stop offset="1" stop-color="#090305"/>
    </linearGradient>
    <radialGradient id="ach-glow-a" cx="85%" cy="0%" r="90%">
      <stop offset="0" stop-color="#8B1226" stop-opacity=".85"/>
      <stop offset="1" stop-color="#450A14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ach-glow-b" cx="90%" cy="0%" r="90%">
      <stop offset="0" stop-color="#EF4444" stop-opacity=".35"/>
      <stop offset="1" stop-color="#450A14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ach-hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset=".4" stop-color="#F59E0B"/>
      <stop offset=".6" stop-color="#FCA5A5"/>
      <stop offset="1" stop-color="#FCA5A5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ach-outline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCA5A5" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FCA5A5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ach-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ach-clip-a"><rect x="0" y="0" width="700" height="250" rx="16"/></clipPath>
    <clipPath id="ach-clip-b"><rect x="0" y="0" width="476" height="250" rx="16"/></clipPath>
    <linearGradient id="ach-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#FCA5A5"/><stop offset="1" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .ach-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ach-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ach-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ach-in {  }
    .a1 {  } .a2 {  } .a3 {  }
    .ach-draw {  stroke-dashoffset: 0;  }
    
    
    
    .ach-trace-a {  stroke-dashoffset: 0;  }
    .ach-trace-b {  stroke-dashoffset: 0;  }
    
    
    
  </style>

  <rect width="1200" height="430" rx="20" fill="url(#ach-bg)"/>
  <rect x=".5" y=".5" width="1199" height="429" rx="19.5" fill="none" stroke="#EF4444" stroke-opacity=".22"/>

  <!-- Lagbeto Startup — hero card -->
  <g class="ach-in a1"><g transform="translate(24 24)">
    <g clip-path="url(#ach-clip-a)">
      <rect width="700" height="250" fill="#120508"/>
      <rect width="700" height="250" fill="url(#ach-glow-a)"/>
      <text class="ach-serif" x="684" y="124" text-anchor="end" font-size="110" font-weight="300" letter-spacing="-4" fill="url(#ach-outline)">LAGBETO</text>
      <rect x="-300" y="0" width="260" height="250" fill="url(#ach-sheen)" transform="skewX(-18)">
        
      </rect>
    </g>
    <rect x=".5" y=".5" width="699" height="249" rx="15.5" fill="none" stroke="#EF4444" stroke-opacity=".38"/>
    <rect class="ach-trace-a" x=".5" y=".5" width="699" height="249" rx="15.5" fill="none" stroke="url(#ach-trace)" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="40" y="0" width="300" height="1" fill="url(#ach-hair)"/>
    <text class="ach-mono" x="36" y="154" font-size="12" letter-spacing="2.6" fill="#EF4444">STARTUP · FOUNDER &amp; LEAD DEVELOPER</text>
    <text class="ach-serif" x="34" y="204" font-size="46" font-weight="300" letter-spacing="-1" fill="#FFFFFF">Lagbeto Platform</text>
    <text class="ach-sans" x="36" y="230" font-size="14" fill="#94A3B8">Building my own startup from the ground up</text>
  </g></g>

  <!-- Featured Project api-docs -->
  <g class="ach-in a2"><g transform="translate(700 24)">
    <g transform="translate(24 0)">
      <g clip-path="url(#ach-clip-b)">
        <rect width="476" height="250" fill="#120508"/>
        <rect width="476" height="250" fill="url(#ach-glow-b)"/>
        <text class="ach-serif" x="490" y="132" text-anchor="end" font-size="130" font-style="italic" font-weight="300" letter-spacing="-4" fill="none" stroke="#FCA5A5" stroke-opacity=".3">API</text>
      </g>
      <rect x=".5" y=".5" width="475" height="249" rx="15.5" fill="none" stroke="#EF4444" stroke-opacity=".3"/>
      <rect class="ach-trace-b" x=".5" y=".5" width="475" height="249" rx="15.5" fill="none" stroke="url(#ach-trace)" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="40" y="0" width="220" height="1" fill="url(#ach-hair)"/>
      <text class="ach-mono" x="32" y="154" font-size="12" letter-spacing="2.6" fill="#EF4444">FEATURED PROJECT · OPEN SOURCE</text>
      <text class="ach-serif" x="30" y="204" font-size="46" font-weight="300" letter-spacing="-1" fill="#FFFFFF">api-docs</text>
      <text class="ach-sans" x="32" y="230" font-size="14" fill="#94A3B8">Comprehensive API documentation architecture</text>
    </g>
  </g></g>

  <!-- Animated connector across the score strip -->
  <path class="ach-draw" d="M24 300 H1176" stroke="#EF4444" stroke-opacity=".35"/>

  <!-- Score strip -->
  <g class="ach-in a3 ach-sans" font-size="13" fill="#94A3B8">
    <g transform="translate(36 300)">
      <circle cx="0" cy="0" r="3.5" fill="#FCA5A5"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#EF4444">LANGUAGES</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#FFFFFF">8+</text>
      <text y="102">TypeScript · Python · Go · Java</text>
    </g>
    <g transform="translate(266 300)">
      <circle cx="0" cy="0" r="3.5" fill="#FCA5A5"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#EF4444">FRAMEWORKS</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#FFFFFF">15+</text>
      <text y="102">React · Next · Flutter · Node</text>
    </g>
    <g transform="translate(496 300)">
      <circle cx="0" cy="0" r="3.5" fill="#FCA5A5"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#EF4444">DATABASES</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#FFFFFF">8+</text>
      <text y="102">Postgres · MongoDB · Redis</text>
    </g>
    <g transform="translate(726 300)">
      <circle cx="0" cy="0" r="3.5" fill="#FCA5A5"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#EF4444">PUBLIC COMMITS</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#FFFFFF">679</text>
      <text y="102">real GitHub contributions</text>
    </g>
    <g transform="translate(956 300)">
      <circle cx="0" cy="0" r="3.5" fill="#FCA5A5"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#EF4444">VENTURE</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#FFFFFF">Lagbeto</text>
      <text y="102">Active Startup</text>
    </g>
  </g>
</svg>